name: Golden Eval Suite

on:
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "evals/**"
      - "data/policies/**"
      - "tests/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "src/**"
      - "evals/**"
      - "data/policies/**"
      - "tests/**"

# No ANTHROPIC_API_KEY is set — this workflow must never make live API calls.
# Replay mode is the only valid mode in CI. Re-record cassettes locally with
# `python -m evals.run --live` and commit them to evals/recorded/.

jobs:
  deterministic-tests:
    name: Deterministic fixture tests (no API key)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ evals/ tests/ --select=E,F,W --ignore=E501,E402

      - name: Run deterministic eval fixture tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_eval_fixtures.py -q --no-header

      - name: Run eval suite (deterministic-only cases)
        env:
          PYTHONPATH: src
        run: |
          python -m evals.run --no-llm

  replay-tests:
    name: Replay eval suite + baseline check (no API key)
    runs-on: ubuntu-latest
    needs: deterministic-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check cassette staleness (recorded fixtures tests)
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_recorded_fixtures.py -q --no-header

      - name: Run eval suite in replay mode
        env:
          PYTHONPATH: src
        run: |
          python -m evals.run --baseline-check

      - name: Upload eval artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-${{ github.sha }}
          path: evals/results/
          retention-days: 30
