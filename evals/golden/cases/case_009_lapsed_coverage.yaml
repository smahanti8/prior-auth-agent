  # The clinical picture is identical to case_001 (Grade IV OA, 8-month
  # conservative failure, BMI 34.1). The only difference is Coverage.status
  # = "cancelled". The pipeline must reject at eligibility before any LLM call.

ground_truth:
  criteria: []
  outcome:
    stage: eligibility
    eligible: false
    validation_error_contains: "cancelled"
    rationale: >
      eligibility() reads Coverage.status = "cancelled" and returns eligible=False.
      The pipeline routes to _reject() which writes final_decision =
      "rejected_at_intake: Coverage status='cancelled', payer=Acme Health Plan".
      No LLM calls. No determination in state. The runner asserts eligible==False,
      final_decision contains "cancelled", and no "determination" key in state.
      This is the eligibility analog of the intake rejection in case_005.
