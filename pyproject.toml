[project]
name = "prior-auth-agent"
version = "0.1.0"
description = "Healthcare prior-authorization agent: LangGraph pipeline with policy RAG and HITL review"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "streamlit>=1.38.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev     = ["pytest>=8.0.0", "pyyaml>=6.0", "ruff>=0.16.0", "mcp>=1.0,<2"]
bedrock = ["anthropic[bedrock]>=0.116.0"]  # adds boto3; needed for LLM_BACKEND=bedrock
mcp     = ["mcp>=1.0,<2"]                  # MCP server — FastMCP + stdio transport; <2: v2 renamed FastMCP to MCPServer

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
